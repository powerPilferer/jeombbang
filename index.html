  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root {
      color-scheme: dark;
      --ink: #ffffff;            /* 본문 글자 */
      --muted: #98989f;          /* iOS secondary label */
      --paper: #1a1a1c;          /* 페이지 배경 */
      --panel: rgba(28, 28, 30, .86);   /* 프로스트 패널 */
      --card: #2c2c2e;           /* 카드 — 테두리 없이 면 톤으로만 구분 */
      --chip: #3a3a3c;
      --line: rgba(255, 255, 255, .08);
      --sel: #3f3f43;            /* 선택 상태 — 카드보다 한 톤 밝게 */
      --accent: #ece1cb;         /* 밥 베이지 — CTA (점빵이 브랜드) */
      --accent-dark: #ece1cb;    /* 밥 베이지 — 텍스트 포인트 */
      --green: #0a84ff;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", sans-serif; color: var(--ink); background: var(--paper); }
    button, input { font: inherit; }
    .app { height: 100%; display: grid; grid-template-columns: 390px minmax(0, 1fr); overflow: hidden; }
    .sidebar { position: relative; z-index: 500; padding: 28px 22px 22px; overflow-y: auto; background: var(--panel); backdrop-filter: blur(30px) saturate(1.4); -webkit-backdrop-filter: blur(30px) saturate(1.4); box-shadow: 14px 0 44px rgba(0, 0, 0, .4); }
    .sidebar::-webkit-scrollbar { width: 8px; }
    .sidebar::-webkit-scrollbar-thumb { background: #48484a; border-radius: 4px; }
    .brand { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand-mark { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 17px; color: #fff; background: var(--accent); font-size: 24px; transform: rotate(-4deg); box-shadow: 0 8px 20px rgba(239, 91, 63, .28); }
    .brand-copy { flex: 1; }
    .eyebrow { margin: 0 0 3px; color: var(--accent-dark); font-size: 12px; font-weight: 800; letter-spacing: .12em; }
    h1 { margin: 0; font-size: 25px; letter-spacing: -.04em; }
    .date { margin-top: 20px; color: var(--muted); font-size: 13px; }
    /* 오늘의 추천 — iOS 카드: 테두리 없이 면 톤 + 큰 볼드 타이포, CTA만 코랄 */
    .hero { margin-top: 12px; padding: 20px; border-radius: 20px; color: var(--ink); background: var(--card); }
    .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .badge { display: inline-flex; padding: 6px 11px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #0a84ff; color: #fff; }
    .hero small { color: var(--muted); }
    .hero h2 { margin: 16px 0 4px; font-size: 27px; font-weight: 800; letter-spacing: -.04em; }
    .menu { margin: 0; color: var(--muted); font-weight: 600; }
    .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
    .fact { padding: 11px 8px; border-radius: 12px; background: var(--chip); text-align: center; }
    .fact strong, .fact span { display: block; }
    .fact strong { font-size: 14px; }
    .fact span { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .hero button { width: 100%; margin-top: 16px; padding: 13px; border: 0; border-radius: 14px; color: #2b2416; background: var(--accent); font-weight: 700; font-size: 14.5px; cursor: pointer; }
    .hero .re-pick { margin-top: 10px; background: var(--chip); color: var(--accent-dark); font-weight: 600; font-size: 13.5px; }
    .hero .re-pick:hover { background: #48484a; }
    .hero .re-pick:disabled { opacity: .6; cursor: default; }
    .section-title { margin: 28px 2px 12px; font-size: 14px; }
    .detail { margin-top: 14px; padding: 18px 18px; border-radius: 20px; background: var(--card); }
    .detail-kicker { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .detail h3 { margin: 5px 0 2px; font-size: 19px; letter-spacing: -.03em; }
    .detail .detail-menu { margin: 0; color: var(--muted); font-weight: 600; font-size: 13.5px; }
    .detail-facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 13px; }
    .detail-facts .fact { border-radius: 10px; background: var(--chip); padding: 9px 6px; text-align: center; }
    .detail-facts .fact strong { font-size: 12.5px; color: var(--ink); }
    .detail-facts .fact span { color: var(--muted); font-size: 10.5px; }
    .detail-note { margin: 12px 0 0; padding-top: 11px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; line-height: 1.55; }
    .detail-links { display: flex; gap: 14px; margin-top: 11px; }
    .visits { margin-top: 13px; display: grid; gap: 7px; }
    .visits-avg { display: flex; align-items: baseline; gap: 7px; margin: 2px 2px 0; font-weight: 800; font-size: 15px; color: #ffd60a; }
    .visits-avg small { color: var(--muted); font-weight: 600; font-size: 11.5px; }
    .visit { padding: 10px 12px; border-radius: 10px; background: var(--chip); font-size: 12.5px; line-height: 1.5; }
    .visit b { color: #ffd60a; margin-right: 6px; }
    .visit small { color: var(--muted); margin-left: 6px; }
    .visit .v-who { display: inline-block; margin-right: 7px; padding: 1px 8px; border-radius: 999px; background: #48484a; color: #fff; font-size: 10.5px; font-weight: 700; }
    .visit .v-who.me { background: var(--accent); color: #2b2416; }
    .mini-rate { color: #ffd60a; font-size: 12px; font-weight: 800; }
    .nick-row { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
    .nick-row b { color: var(--accent-dark); }
    #nick-edit { border: 0; background: var(--chip); color: var(--muted); border-radius: 8px; padding: 3px 9px; font-size: 11.5px; cursor: pointer; }
    .visit-btn { margin-top: 14px; width: 100%; padding: 12px; border: 0; border-radius: 14px; color: var(--accent-dark); background: var(--chip); font-weight: 600; cursor: pointer; }
    .visit-form { margin-top: 12px; padding: 14px; border-radius: 16px; background: #1c1c1e; display: grid; gap: 9px; }
    .star-row { display: flex; align-items: center; gap: 2px; }
    .star { border: 0; background: none; padding: 2px; font-size: 30px; line-height: 1; color: #6e6e73; cursor: pointer; transition: color .1s, transform .1s; }
    .star:hover { transform: scale(1.15); }
    .star.on { color: #ffd60a; text-shadow: none; }
    .star.half { background: linear-gradient(90deg, #ffd60a 50%, #6e6e73 50%);
      -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .star-label { margin-left: 8px; font-size: 12px; color: var(--muted); font-weight: 700; }
    .visit-form textarea { border: 0; border-radius: 10px; padding: 10px 11px; font-size: 13px; resize: vertical; min-height: 52px; font-family: inherit; background: #3a3a3c; color: var(--ink); }
    .visit-form textarea:focus { outline: 1.5px solid #8d9db3; }
    .visit-form textarea::placeholder { color: #9a9aa0; }
    .visit-save { padding: 12px; border: 0; border-radius: 12px; background: var(--accent); color: #2b2416; font-weight: 700; cursor: pointer; }
    .visited-box { margin-top: 28px; padding: 16px 14px 14px; border-radius: 20px; background: rgba(44,44,46,.55); }
    .visited-box .vb-title { display: flex; align-items: center; gap: 7px; margin: 0 2px 11px; font-size: 14px; }
    .visited-box .vb-title .n { display: inline-grid; place-items: center; min-width: 21px; height: 21px;
      padding: 0 6px; border-radius: 999px; background: #0a84ff; color: #fff; font-size: 11.5px; font-weight: 800; }
    .visited-empty { padding: 13px 14px; border-radius: 12px;
      color: var(--muted); font-size: 12.5px; line-height: 1.5; background: var(--card); }
    .visit-card { position: relative; width: 100%; display: flex; flex-direction: column;
      align-items: flex-start; gap: 2px; padding: 13px 34px 13px 15px;
      border: 0; border-radius: 14px; background: var(--card);
      cursor: pointer; text-align: left; color: var(--ink); transition: .15s ease; }
    .visit-card:hover { background: var(--sel); }
    .visit-card .v-stars { line-height: 1; display: flex; }
    .visit-card .vstar { font-size: 19px; color: #6e6e73; cursor: pointer; padding: 2px 2px; transition: transform .1s; }
    .visit-card .vstar:hover { transform: scale(1.2); }
    .visit-card .vstar.on { color: #ffd60a; }
    .visit-card .vstar.half { background: linear-gradient(90deg, #ffd60a 50%, #6e6e73 50%);
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    .visit-card .v-name { font-size: 14px; font-weight: 800; margin-top: 2px; }
    .visit-card .v-meta { color: var(--muted); font-size: 11.5px; line-height: 1.4; }
    .visit-card .del { position: absolute; top: 10px; right: 10px; }
    .detail-tel { color: var(--accent-dark); font-weight: 700; font-size: 13px; text-decoration: none; }
    .detail-naver { color: #03c75a; font-weight: 700; font-size: 13px; text-decoration: none; }
    .filters { display: flex; gap: 7px; flex-wrap: wrap; }
    .filter { padding: 8px 13px; border: 0; border-radius: 999px; color: var(--muted); background: var(--card); cursor: pointer; font-weight: 600; }
    .filter.active { color: #fff; background: #0a84ff; font-weight: 700; }
    .list { display: grid; gap: 12px; }
    /* 후보 리스트 — iOS: 테두리 없이 면 톤만으로, 선택은 한 톤 밝게 */
    .place { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 15px 16px; border: 0; border-radius: 16px; text-align: left; color: var(--ink); background: var(--card); cursor: pointer; transition: background .15s ease; }
    .place:hover { background: #333336; }
    .place.active { background: var(--sel); }
    .place strong { display: block; margin-bottom: 4px; }
    .place span { color: var(--muted); font-size: 12px; }
    .place .price { color: #fff; font-weight: 700; }
    .map-shell { position: relative; min-width: 0; background: var(--paper); }
    /* 카카오맵은 다크 스타일이 없어 색반전+색상회전으로 어둡게 만들고, 오버레이(핀·팝업)는 역필터로 원색 복원 */
    #map { width: 100%; height: 100%; background: #e9e2d6; }
    .map-title { position: absolute; z-index: 450; top: 22px; left: 24px; display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 13px; background: var(--panel); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4); box-shadow: 0 8px 24px rgba(0,0,0,.35); font-size: 13px; font-weight: 700; }
    .map-title i { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 5px rgba(79,174,134,.18); }
    /* 팝업·핀 — 지도는 밝은 원래 모습이므로 라이트 팔레트를 그대로 쓴다 (페이지 다크와 별개) */
    .kpopup { position: relative; width: 230px; padding: 15px 17px 14px; background: #fff; border-radius: 18px; box-shadow: 0 14px 40px rgba(41,34,25,.28); font-size: 13px; color: #191f28; white-space: normal; word-break: keep-all; }
    .kpopup::after { content: ''; position: absolute; left: 50%; bottom: -7px; width: 15px; height: 15px; background: #fff; transform: translateX(-50%) rotate(45deg); border-radius: 3px; }
    .kpopup .kclose { position: absolute; top: 9px; right: 11px; border: 0; background: none; padding: 2px; color: #8b95a1; font-size: 13px; cursor: pointer; }
    .popup-kicker { color: #a4835a; font-size: 11px; font-weight: 800; }

    // 팝업 — 오버레이 하나를 재사용한다
    const popupOv = new kakao.maps.CustomOverlay({ yAnchor: 1.35, zIndex: 30 });

      const el = document.createElement('div');
      el.className = 'kpopup';
      el.innerHTML = `<button type="button" class="kclose" aria-label="닫기">✕</button>

        <p class="popup-copy">${place.menu} · ${place.price.toLocaleString()}원<br>${place.walk}<br>${place.hours}</p>`;
      el.querySelector('.kclose').addEventListener('click', closePopup);
      popupOv.setContent(el);
      popupOv.setPosition(new kakao.maps.LatLng(place.lat, place.lng));
      popupOv.setMap(map);
    }

    const markers = new Map();
    places.forEach((place, index) => {
      const el = document.createElement('div');
      el.className = `pin ${place.today ? 'today' : ''}`;
      el.style.cursor = 'pointer';
      el.innerHTML = `<span>${index + 1}</span>`;
      el.addEventListener('click', () => selectPlace(place.id, false));
      const ov = new kakao.maps.CustomOverlay({
        map, position: new kakao.maps.LatLng(place.lat, place.lng),
        content: el, yAnchor: 0.9, zIndex: place.today ? 20 : 10
      });
      markers.set(place.id, ov);
    });

    const list = document.getElementById('place-list');
    let activeFilter = 'all';

    function applyVisitedFilter() {
      // 방문 기록이 있는 가게는 지도 핀도 숨긴다 (별점을 지우면 다시 나타남)
      places.forEach(pl => {
        const hidden = visitsOf(pl.id).length > 0 && !pl.today;
        const mk = markers.get(pl.id);
        if (!mk) return;
        if (hidden && mk.getMap()) mk.setMap(null);
        if (!hidden && !mk.getMap()) mk.setMap(map);
      });
    }

    function renderList() {
      list.innerHTML = '';
      places
        .filter(p => p.today || !visitsOf(p.id).length)   // 가본 곳은 후보에서 제외
        .filter(p => activeFilter === 'all' || p.category === activeFilter)
        .forEach(place => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `place ${place.today ? 'active' : ''}`;
        button.dataset.id = place.id;
        const vmark = visitsOf(place.id).length ? ' <span title="다녀온 곳">🍚</span>' : '';

        list.appendChild(button);

      applyVisitedFilter();

        <div class="detail-links">
          ${place.tel ? `<a class="detail-tel" href="tel:${place.tel.replace(/-/g, '')}">📞 ${place.tel}</a>` : ''}
          <a class="detail-naver" href="${place.naver || 'https://map.naver.com/p/search/' + encodeURIComponent(place.name + ' ' + REGION.naver)}" target="_blank" rel="noopener">🗺 네이버지도</a>
        </div>
        ${renderVisits(place.id)}
        <button type="button" class="visit-btn" id="visit-btn">🍚 다녀왔어요 — 리뷰 남기기</button>
        <div class="visit-form" id="visit-form" hidden>
          <div class="star-row" id="rate-row">
            <button type="button" class="star" data-v="1">★</button>
            <button type="button" class="star" data-v="2">★</button>
            <button type="button" class="star" data-v="3">★</button>
            <button type="button" class="star" data-v="4">★</button>
            <button type="button" class="star" data-v="5">★</button>
            <span class="star-label" id="star-label">별점을 골라주세요</span>
          </div>
          <textarea id="visit-comment" placeholder="짧은 감상평 (선택) — 예: 볶음밥 필수. 5시 도착하니 웨이팅 없음"></textarea>
          <div class="nick-row">작성자 <b id="nick-cur"></b><button type="button" id="nick-edit">변경</button></div>
          <button type="button" class="visit-save" id="visit-save">기록하기</button>
        </div>`;
      panel.hidden = false;
      wireVisitForm(place);
    }

    // ── 방문 기록 (모아 찜과 같은 흐름: localStorage → 내보내기 → 점빵이가 다음 실행 때 반영)
    const VISIT_URL = 'https://script.google.com/macros/s/AKfycbz9R7UdoPS5dytDBHvZosK7N1cw9ba1L1afdZpDlJ3AuUPpIviG_wF3y_9A5Dw7yFxS9A/exec';
    const VKEY = 'jb-visited-v2';
    let visits = [];                        // 서버(구글시트) 기록 — 모든 기기에서 공유
    try { visits = JSON.parse(localStorage.getItem(VKEY)) || []; } catch (e) {}   // 오프라인 캐시

    // ── 작성자(닉네임) — 다인 리뷰. 옛 기록·미설정 기기는 '주인장'으로 취급
    let me = localStorage.getItem('jb-user') || '';
    // 다인 모드 이전부터 쓰던 기기(캐시 보유)는 주인장 기기로 자동 인정
    if (!me && visits.length) { me = '주인장'; localStorage.setItem('jb-user', me); }
    const whoAmI = () => me || '주인장';
    function ensureNick() {
      if (me) return true;
      const n = (prompt('리뷰에 표시할 닉네임을 정해주세요 (처음 한 번만)') || '').trim().slice(0, 12);
      if (!n) return false;
      me = n;
      localStorage.setItem('jb-user', n);
      return true;
    }
    // 리뷰는 남이 쓴 텍스트 — 화면에 넣기 전에 이스케이프
    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    function visitsOf(id) {   // 내 기록만 — 후보 제외·핀 숨김·다녀온곳은 개인 기준 유지
      return visits.filter(v => v.id === id && v.rate > 0 && (v.user || '주인장') === whoAmI()).slice().reverse();
    }
    function allVisitsOf(id) {   // 모두의 리뷰 — 상세·평균용
      return visits.filter(v => v.id === id && v.rate > 0).slice().reverse();
    }
    function avgOf(id) {
      const rows = allVisitsOf(id);
      return rows.length ? rows.reduce((s, v) => s + v.rate, 0) / rows.length : 0;
    }
    function normDate(s) {
      const m = String(s).match(/\d{4}-\d{2}-\d{2}/);
      if (m) return m[0];
      const d = new Date(s);
      return isNaN(d) ? String(s) : d.toISOString().slice(0, 10);
    }
    async function syncVisits() {
      try {
        const d = await fetch(VISIT_URL, { cache: 'no-store' }).then(r => r.json());
        if (d.ok) {
          const byKey = {};   // 가게+작성자별 마지막 기록만 + 활동순 정렬
          d.list.forEach(v => {
            const k = v.id + '|' + (v.user || '주인장');
            delete byKey[k];
            byKey[k] = { ...v, user: v.user || '주인장', date: normDate(v.date) };
          });
          visits = Object.values(byKey);
          localStorage.setItem(VKEY, JSON.stringify(visits));
          renderList();
          renderVisitedList();
        }
      } catch (e) { /* 오프라인 — 캐시로 표시 */ }
    }
    // 옛 버전(기기 저장)에서 남긴 기록 구조 — 서버로 올려보내고 키를 비운다
    (function rescueOldRecords() {
      let old = [];
      try { old = JSON.parse(localStorage.getItem('jb-visited')) || []; } catch (e) {}
      if (!old.length) return;
      const LEGACY = { '최고': 5, '좋음': 4, '보통': 3, '별로': 1 };
      old.forEach(v => {
        const rate = typeof v.rate === 'number' ? v.rate : (LEGACY[v.rate] || 0);
        if (!v.id || !rate) return;
        fetch(VISIT_URL, { method: 'POST', mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ id: v.id, name: v.name || '', menu: v.menu || '',
                                 rate, comment: v.comment || '', date: v.date || '', user: '주인장' }) }).catch(() => {});
      });
      localStorage.removeItem('jb-visited');
      setTimeout(syncVisits, 2500);   // 전송 후 서버 기준으로 다시 그림
    })();
    const RATE_EMOJI = { '최고': '😋', '좋음': '👍', '보통': '😐', '별로': '👎' };  // 옛 기록 호환용
    const STAR_WORDS = { 1: '별로였어요', 2: '아쉬워요', 3: '보통', 4: '좋았어요', 5: '또 가고 싶다!' };
    function rateBadge(r) { return typeof r === 'number' ? '★' + r : (RATE_EMOJI[r] || '🍚'); }
    function starCells(id, rate) {
      let h = '';
      for (let i = 1; i <= 5; i++) {
        const cls = rate >= i ? 'on' : (rate >= i - 0.5 ? 'half' : '');
        h += `<span class="vstar ${cls}" data-id="${id}" data-v="${i}">★</span>`;
      }
      return h;
    }
    function rerate(el, e) {
      if (!ensureNick()) return;   // 닉네임 없이 별을 만지면 먼저 정하게 — 남 기록 오수정 방지
      const id = el.dataset.id;
      const cur = visits.find(v => v.id === id && (v.user || '주인장') === whoAmI());   // 내 기록만 수정
      if (!cur) { renderList(); renderVisitedList(); return; }
      const rect = el.getBoundingClientRect();
      const leftHalf = (e.clientX - rect.left) < rect.width / 2;
      let newRate = Number(el.dataset.v) - (leftHalf ? 0.5 : 0);
      if (Math.abs((cur.rate || 0) - newRate) < 0.001) newRate = 0;   // 같은 점수 한 번 더 → 취소
      cur.rate = newRate;
      cur.date = new Date().toISOString().slice(0, 10);
      if (newRate === 0) cur._cleared = true;
      localStorage.setItem(VKEY, JSON.stringify(visits));
      queueSave({ id, name: cur.name, menu: cur.menu || '', rate: newRate,
                  comment: cur.comment || '', date: cur.date, user: whoAmI() });
      renderList();
      renderVisitedList();
    }

    // ── 지연 저장: 별을 1분간 더 안 건드리면 전송, 페이지를 떠나면 즉시 전송
    const pendingSaves = {};   // id → {rec, timer}
    function queueSave(rec) {
      if (pendingSaves[rec.id]) clearTimeout(pendingSaves[rec.id].timer);
      pendingSaves[rec.id] = { rec, timer: setTimeout(() => flushSave(rec.id), 60000) };
    }
    function flushSave(id) {
      const pnd = pendingSaves[id];
      if (!pnd) return;
      delete pendingSaves[id];
      fetch(VISIT_URL, { method: 'POST', mode: 'no-cors', keepalive: true,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(pnd.rec) }).catch(() => {});
    }
    function flushAllSaves() {
      Object.keys(pendingSaves).forEach(id => {
        const pnd = pendingSaves[id];
        clearTimeout(pnd.timer);
        delete pendingSaves[id];
        if (navigator.sendBeacon) {
          navigator.sendBeacon(VISIT_URL, new Blob([JSON.stringify(pnd.rec)], { type: 'text/plain;charset=utf-8' }));
        } else {
          fetch(VISIT_URL, { method: 'POST', mode: 'no-cors', keepalive: true,
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(pnd.rec) }).catch(() => {});
        }
      });
    }
    document.addEventListener('visibilitychange', () => { if (document.hidden) flushAllSaves(); });
    window.addEventListener('pagehide', flushAllSaves);
    function starsHtml(r) {
      if (typeof r !== 'number') r = ({ '최고': 5, '좋음': 4, '보통': 3, '별로': 1 })[r] || 0;
      const full = Math.floor(r), half = r % 1 >= 0.5;
      const onPart = '★'.repeat(full) + (half ? '½' : '');
      const offPart = '☆'.repeat(5 - full - (half ? 1 : 0));
      return `<span class="on">${onPart}</span><span class="off">${offPart}</span>`;
    }
    function rateText(r) {
      if (typeof r === 'number') {
        const full = Math.floor(r), half = r % 1 >= 0.5;
        return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(5 - full - (half ? 1 : 0));
      }
      return (RATE_EMOJI[r] || '') + ' ' + r;
    }

    function renderVisits(id) {
      const rows = allVisitsOf(id);   // 모두의 리뷰
      if (!rows.length) return '';
      const avg = avgOf(id);
      return `<div class="visits">
        <div class="visits-avg">★ ${avg.toFixed(1)}<small>리뷰 ${rows.length}개</small></div>
        ${rows.map(v => {
          const mine = (v.user || '주인장') === whoAmI();
          return `<div class="visit"><span class="v-who${mine ? ' me' : ''}">${esc(v.user || '주인장')}</span><b>${rateText(v.rate)}</b>${v.comment ? ' · ' + esc(v.comment) : ''}<small>${v.date}</small></div>`;
        }).join('')}</div>`;
    }

    function wireVisitForm(place) {
      const btn = document.getElementById('visit-btn');
      const form = document.getElementById('visit-form');
      let rate = 0;
      btn.addEventListener('click', () => { form.hidden = !form.hidden; });
      const nickCur = document.getElementById('nick-cur');
      nickCur.textContent = whoAmI();
      document.getElementById('nick-edit').addEventListener('click', () => {
        const n = (prompt('리뷰에 표시할 닉네임', whoAmI()) || '').trim().slice(0, 12);
        if (!n) return;
        me = n;
        localStorage.setItem('jb-user', n);
        nickCur.textContent = n;
        renderList();
        renderVisitedList();
      });
      const stars = [...form.querySelectorAll('.star')];
      function paintStars() {
        stars.forEach(el => {
          const v = Number(el.dataset.v);
          el.classList.toggle('on', rate >= v);
          el.classList.toggle('half', rate >= v - 0.5 && rate < v);
        });
        document.getElementById('star-label').textContent =
          `${rate}점 · ${STAR_WORDS[Math.max(1, Math.round(rate))]}`;
      }
      stars.forEach(b => b.addEventListener('click', e => {
        const rect = b.getBoundingClientRect();
        const leftHalf = (e.clientX - rect.left) < rect.width / 2;
        rate = Number(b.dataset.v) - (leftHalf ? 0.5 : 0);
        paintStars();
      }));
      document.getElementById('visit-save').addEventListener('click', () => {
        if (!rate) { alert('별점을 골라주세요!'); return; }
        if (!ensureNick()) return;
        nickCur.textContent = whoAmI();
        if (visitsOf(place.id).length &&
            !confirm(`"${place.name}"에 내 리뷰가 이미 있어요.\n지금 내용으로 업데이트할까요?`)) return;
        const comment = document.getElementById('visit-comment').value.trim();
        const rec = { id: place.id, name: place.name, menu: place.menu, rate, comment,
                      date: new Date().toISOString().slice(0, 10), user: whoAmI() };
        // 가게당·사람당 1건 — 내 이전 기록만 대체
        visits = visits.filter(v => !(v.id === place.id && (v.user || '주인장') === whoAmI()));
        visits.push(rec);
        localStorage.setItem(VKEY, JSON.stringify(visits));
        fetch(VISIT_URL, { method: 'POST', mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(rec) }).catch(() => {});
        renderList();
        renderVisitedList();
        renderDetail(place);
      });
    }


    function renderVisitedList() {
      const wrap = document.getElementById('visited-list');
      // 내 기록만, 별점 무관, 기록 활동 순서(최근이 위)로 쌓는다
      const src2 = visits.filter(v => (v.user || '주인장') === whoAmI() && (v.rate > 0 || v._cleared)).slice().reverse();
      document.getElementById('visited-count').textContent = src2.filter(v => v.rate > 0).length;
      if (!src2.length) {
        wrap.innerHTML = '<div class="visited-empty">아직 기록이 없어요. 다녀온 식당을 클릭해 \'🍚 다녀왔어요\'로 남겨보세요.</div>';
        return;
      }
      wrap.innerHTML = src2.map(v => {
        const meta = v.rate > 0
          ? `${esc(v.comment || v.menu || '')} · ${v.date}`
          : '별점을 지웠어요 — 페이지를 나가면 목록에서 사라집니다';
        return `<button type="button" class="visit-card visited-row" data-id="${esc(v.id)}">
          <span class="v-stars">${starCells(v.id, v.rate)}</span>
          <strong class="v-name">${esc(v.name)}</strong>
          <span class="v-meta">${meta}</span></button>`;
      }).join('');
      wrap.querySelectorAll('.vstar').forEach(s => s.addEventListener('click', e => {
        e.stopPropagation();
        rerate(s, e);
      }));
      wrap.querySelectorAll('.visited-row').forEach(b => b.addEventListener('click', () => {
        const pl = places.find(x => x.id === b.dataset.id);
        if (pl) selectPlace(pl.id, true);
        else showVisitOnlyDetail(b.dataset.id);
      }));
    }

    function showVisitOnlyDetail(id) {
      const rows = visitsOf(id);
      if (!rows.length) return;
      const v = rows[0];
      const panel = document.getElementById('detail');
      panel.innerHTML = `
        <div class="detail-kicker">다녀온 곳 · 오늘 후보에는 없어요</div>
        <h3>${esc(v.name)}</h3>
        ${v.menu ? `<p class="detail-menu">${esc(v.menu)}</p>` : ''}
        ${renderVisits(id)}
        <div class="detail-links">
          <a class="detail-naver" href="https://map.naver.com/p/search/${encodeURIComponent(v.name)}" target="_blank" rel="noopener">🗺 네이버지도</a>
        </div>`;
      panel.hidden = false;
    }


    function selectPlace(id, moveMap = true) {
      const place = places.find(p => p.id === id);
      document.querySelectorAll('.place').forEach(el => el.classList.toggle('active', el.dataset.id === id));
      if (moveMap) {
        if (map.getLevel() > 3) map.setLevel(3);
        map.panTo(new kakao.maps.LatLng(place.lat, place.lng));
      }
      openPopupFor(place);
      renderDetail(place);
    }

    document.querySelectorAll('.filter').forEach(button => {
      button.addEventListener('click', () => {
        activeFilter = button.dataset.filter;
        document.querySelectorAll('.filter').forEach(el => el.classList.toggle('active', el === button));
        renderList();
      });
    });
    document.querySelector('[data-focus]').addEventListener('click', event => selectPlace(event.currentTarget.dataset.focus, true));

    // ── 다시 추천하기: 점빵이에게 '새로운 곳 발굴' 요청을 보낸다 (맥이 몇 분 내 처리)
    document.getElementById('re-pick').addEventListener('click', () => {
      if (!confirm('점빵이에게 완전히 새로운 곳을 다시 찾아달라고 할까요?\n(찾고 검증하는 데 5~10분 정도 걸려요)')) return;
      fetch(VISIT_URL, { method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ id: '__repick__', name: '재추천요청', rate: 0, comment: '',
                               date: new Date().toISOString().slice(0, 10) }) }).catch(() => {});
      const b = document.getElementById('re-pick');
      b.disabled = true;
      b.textContent = '🔎 점빵이가 새 곳을 찾는 중… 5~10분 뒤 새로고침해주세요';
    });

    renderList();
    renderVisitedList();
    syncVisits();
    setTimeout(() => selectPlace(places.find(p => p.today)?.id || places[0].id, false), 450);
  </script>
</body>
</html>
